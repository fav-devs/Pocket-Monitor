name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libavcodec-dev libavutil-dev libswscale-dev libvulkan-dev mesa-vulkan-drivers glslang-tools
      - name: Build Swift desktop facade
        run: ./scripts/desktop-build-swift-core.sh --configuration release
      - name: Test Swift core
        run: swift test
      - name: Format, lint, and test Rust desktop app
        working-directory: Apps/Desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
