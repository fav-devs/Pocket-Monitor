plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.favdevs.pocketnative'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "com.favdevs.pocketnative"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // PocketHands: MediaPipe Tasks (hand landmarker, face detector; models in
  // src/main/assets/pocket-hands, see NOTICE.md there) and CameraX for the front-camera source,
  // at expo-camera's CameraX version so the app resolves one copy.
  implementation 'com.google.mediapipe:tasks-vision:0.10.35'
  def camerax_version = '1.6.0'
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  testImplementation 'junit:junit:4.13.2'
}
