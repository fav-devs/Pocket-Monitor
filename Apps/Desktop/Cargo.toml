[workspace]
resolver = "2"
members = [
    "crates/opc-camera",
    "crates/opc-chrome",
    "crates/opc-core-sys",
    "crates/opc-decode",
    "crates/opc-media",
    "crates/opc-monitor",
    "crates/opc-relay",
    "crates/opc-render",
    "crates/opc-ui",
    "crates/opc-vcam",
    "crates/opc-vcam-win",
    "crates/opc-watcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fav-devs/Pocket-Monitor"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

# The desktop "debug" build is what operators run against a physical camera. It keeps
# symbols and assertions, but an unoptimised 720p decode/chrome pipeline falls to
# single-digit FPS on integrated GPUs before Vulkan is even given a frame.
[profile.debug-camera]
inherits = "dev"
opt-level = 2
