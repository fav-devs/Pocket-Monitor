[package]
name = "opc-monitor"
description = "The desktop viewfinder: a laptop window on the camera, with the gimbal, zoom, recording and tracking under the operator's hands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Everything worth testing is in the library; the binary is the window and the socket
# around it. Building a test harness for it would ask a machine with no Swift toolchain
# to link the core just to run zero tests.
[[bin]]
name = "opc-monitor"
path = "src/main.rs"
test = false

[dependencies]
opc-camera = { path = "../opc-camera" }
opc-relay = { path = "../opc-relay" }
opc-core-sys = { path = "../opc-core-sys" }
opc-chrome = { path = "../opc-chrome" }
opc-decode = { path = "../opc-decode" }
opc-media = { path = "../opc-media" }
opc-render = { path = "../opc-render" }
opc-ui = { path = "../opc-ui" }
opc-vcam = { path = "../opc-vcam" }
raw-window-handle = "0.6"
winit = "0.30"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
uuid = "1"
gilrs = "0.11"
cpal = "0.15"

# Hand tracking models run through ONNX Runtime: on the GPU through DirectML on Windows.
[target.'cfg(windows)'.dependencies]
# Seals the saved home Wi-Fi password to this Windows user (DPAPI).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
ort = { version = "=2.0.0-rc.10", features = ["directml"] }

[target.'cfg(not(windows))'.dependencies]
ort = "=2.0.0-rc.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
btleplug = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# CoreBluetooth discovery errors could leave connect() pending forever in 0.11.
btleplug = "=0.13.5"
# btleplug collapses unsupported/unauthorized adapter states into Unknown.
objc2-core-bluetooth = { version = "0.2.2", features = ["CBCentralManager", "CBManager"] }
# The current Wi-Fi name, and the Location permission macOS requires to read it.
objc2 = "0.5.2"
objc2-core-location = { version = "0.2.2", features = ["CLLocationManager"] }
objc2-core-wlan = { version = "0.2.2", features = ["CWInterface", "CWWiFiClient"] }
objc2-foundation = { version = "0.2.2", features = ["NSString"] }

[features]
# Keep a terminal attached on Windows, for reading eprintln output while developing.
console = []

[lints]
workspace = true
